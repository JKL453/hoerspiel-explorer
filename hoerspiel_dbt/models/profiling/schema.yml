version: 2

models:
  - name: int_episode_variant_features
    description: Read-only features and publication markers for every publication in the catalog.
    columns:
      - {name: episode_id, description: Source episode identifier, data_tests: [not_null, unique]}
      - {name: source_key, description: Stable source identifier, data_tests: [not_null, unique]}
      - name: base_category
        description: Marker-based category before regular-reference selection.
        data_tests:
          - not_null
          - accepted_values:
              values: [regular_candidate, format_reissue, box_set, compilation, live_production, film_adaptation, special, other_production, unknown]
      - {name: range_start, description: First explicit contained episode number}
      - {name: range_end, description: Last explicit contained episode number}
      - {name: edition_markers, description: Comma-separated machine-readable publication markers}
      - {name: comparison_title, description: Conservative normalized title used only for exact matching}
      - {name: cast_fingerprint, description: Stable hash of sorted speaker and role IDs when credits are available}
  - name: int_regular_episode_references
    description: Deterministic reference release for each regular episode number within a source series.
    columns:
      - {name: series_episode_number_key, description: Unique series and episode-number grain, data_tests: [not_null, unique]}
      - {name: series_id, description: Source series identifier, data_tests: [not_null]}
      - {name: episode_id, description: Reference episode identifier, data_tests: [not_null, unique]}
      - {name: episode_number, description: Episode number within the source series, data_tests: [not_null]}
      - {name: comparison_title, description: Normalized reference title, data_tests: [not_null]}
  - name: episode_variant_classifications
    description: Exactly one publication category for each catalog record, with accepted review overrides taking precedence.
    columns:
      - {name: episode_id, description: Source episode identifier, data_tests: [not_null, unique]}
      - {name: source_key, description: Stable source identifier, data_tests: [not_null, unique]}
      - name: variant_category
        description: Effective category in analytics; no production data is changed by this value.
        data_tests:
          - not_null
          - accepted_values:
              values: [regular_episode, format_reissue, box_set, compilation, live_production, film_adaptation, special, other_production, unknown]
      - name: classification_source
        description: Whether the effective category came from deterministic rules or an accepted review override.
        data_tests:
          - not_null
          - accepted_values:
              values: [machine, reviewed]
  - name: episode_variant_candidates
    description: Review-only links from publication variants to regular references within the same source series.
    columns:
      - {name: candidate_id, description: Stable hash of source target and relationship, data_tests: [not_null, unique]}
      - name: source_episode_id
        description: Publication variant being reviewed.
        data_tests:
          - not_null
          - relationships:
              to: ref('episode_variant_classifications')
              field: episode_id
      - name: target_episode_id
        description: Proposed regular reference; null for unresolved candidates.
        data_tests:
          - relationships:
              to: ref('int_regular_episode_references')
              field: episode_id
      - {name: target_source_key, description: Stable target source identifier; null for unresolved candidates}
      - name: proposed_relationship
        description: Meaning of the proposed source-to-target link.
        data_tests:
          - not_null
          - accepted_values:
              values: [same_recording, contains, same_story_different_production, unresolved]
      - name: confidence_score
        description: Deterministic review-order score from 0 through 100.
        data_tests: [not_null]
      - name: confidence_class
        description: Review-order band derived from confidence score.
        data_tests:
          - not_null
          - accepted_values:
              values: [high, medium, low]
      - {name: match_reasons, description: JSON array of deterministic evidence used by the proposal, data_tests: [not_null]}
