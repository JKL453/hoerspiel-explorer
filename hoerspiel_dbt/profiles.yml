hoerspiel_dbt:
  target: prod
  outputs:
    prod:
      type: postgres
      host: "{{ env_var('DBT_HOST') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'postgres') }}"
      schema: analytics
      sslmode: "{{ env_var('DBT_SSLMODE', 'require') }}"
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      connect_timeout: 15
