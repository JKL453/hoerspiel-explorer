name: hoerspiel-explorer
prefect-version: 3.x

pull:
  - prefect.deployments.steps.git_clone:
      id: clone_step
      repository: https://github.com/JKL453/hoerspiel-explorer.git
      branch: main
  - prefect.deployments.steps.pip_install_requirements:
      directory: "{{ clone_step.directory }}"
      requirements_file: requirements.txt
  - prefect.deployments.steps.run_shell_script:
      script: pip install -e .
      directory: "{{ clone_step.directory }}"
  - prefect.deployments.steps.set_working_directory:
      directory: "{{ clone_step.directory }}"

deployments:
  - name: scrape-hoerspiele-de-series-pages
    entrypoint: src/hoerspiel_discovery/flows/scrape_series_pages.py:scrape_hoerspiele_de
    work_pool:
      name: data-platform

  - name: parse-series-pages
    entrypoint: src/hoerspiel_discovery/flows/parse_series_pages.py:parse_all_series_pages
    work_pool:
      name: data-platform

  - name: fetch-episode-pages
    entrypoint: src/hoerspiel_discovery/flows/fetch_episode_pages.py:fetch_all_episode_pages
    work_pool:
      name: data-platform

  - name: build-cleaned-details
    entrypoint: src/hoerspiel_discovery/flows/build_cleaned_details.py:build_cleaned_details
    work_pool:
      name: data-platform
      job_variables:
        env:
          HOERSPIEL_DATA_DIR: /data/hoerspiel-explorer

  - name: load-cleaned-details
    entrypoint: src/hoerspiel_discovery/flows/load_cleaned_details.py:load_cleaned_details
    work_pool:
      name: data-platform
      job_variables:
        env:
          HOERSPIEL_DATA_DIR: /data/hoerspiel-explorer

  - name: repair-page-encodings
    entrypoint: src/hoerspiel_discovery/flows/repair_page_encodings.py:repair_page_encodings
    work_pool:
      name: data-platform
